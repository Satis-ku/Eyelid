name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its build that is still running. Pushes to main and develop
# get a group per commit, so every merge is built instead of cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Eyelid.app
    # Pinned instead of macos-latest, so a new runner image can't switch the toolchain unnoticed.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          # build-app.sh reads the version from tags and numbers builds by commit count.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          cmake --version | head -1

      - name: Build
        run: make app

      - name: Test
        run: make test

      - name: Package
        # ditto keeps the symlinks inside MediaRemoteAdapter.framework, which an artifact upload would flatten.
        run: ditto -c -k --keepParent build/Eyelid.app build/Eyelid.zip

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Eyelid-${{ github.sha }}
          path: build/Eyelid.zip
          retention-days: 14
          if-no-files-found: error
