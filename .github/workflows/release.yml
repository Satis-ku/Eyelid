name: Release

on:
  push:
    tags: ["v*"]
  # A dry run that builds and checks the package without publishing it, whenever the release setup changes.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - scripts/build-app.sh
      - Resources/Info.plist
      - Package.swift

# Read-only by default. Only the publish job, which runs for tags, can write.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out with submodules and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # build-app.sh numbers builds by commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dry-run"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make test

      - name: Build a universal app
        run: UNIVERSAL=1 make app

      - name: Check the app
        run: |
          app=build/Eyelid.app
          plist="$app/Contents/Info.plist"
          binaries=("$app/Contents/MacOS/Eyelid" "$app/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter")

          built="$(plutil -extract CFBundleShortVersionString raw "$plist")"
          if [[ "$built" != "$VERSION" ]]; then
            echo "::error::The app reports version $built instead of $VERSION"
            exit 1
          fi

          # A binary built for a newer macOS than LSMinimumSystemVersion fails to load on older systems.
          minimum="$(plutil -extract LSMinimumSystemVersion raw "$plist")"
          for binary in "${binaries[@]}"; do
            for arch in arm64 x86_64; do
              minos="$(vtool -arch "$arch" -show-build "$binary" | awk '/minos/ { print $2 }')"
              if [[ "$minos" != "$minimum" ]]; then
                echo "::error::$(basename "$binary") ($arch) requires macOS $minos instead of $minimum"
                exit 1
              fi
            done
          done

          # Eyelid may hold Accessibility access, so nothing may be able to load code into it:
          # the hardened runtime on both binaries, and a __RESTRICT segment so dyld ignores DYLD_* variables.
          # Output goes into variables first: with pipefail, `| grep -q` fails when it stops reading early.
          for binary in "${binaries[@]}"; do
            signature="$(codesign -dv "$binary" 2>&1)"
            if [[ ! "$signature" =~ flags=[^[:space:]]*runtime ]]; then
              echo "::error::$(basename "$binary") isn't signed with the hardened runtime"
              exit 1
            fi
          done
          for arch in arm64 x86_64; do
            load_commands="$(otool -arch "$arch" -l "${binaries[0]}")"
            if [[ "$load_commands" != *"segname __RESTRICT"* ]]; then
              echo "::error::Eyelid ($arch) has no __RESTRICT segment"
              exit 1
            fi
          done

          # Stripped: debug symbols would carry the runner's paths.
          symbols="$(nm -ap "${binaries[0]}")"
          if [[ "$symbols" == *" OSO "* ]]; then
            echo "::error::Eyelid still has debug symbols"
            exit 1
          fi

          codesign --verify --deep --strict "$app"
          echo "Eyelid $VERSION ($(plutil -extract CFBundleVersion raw "$plist")), universal, macOS $minimum+, hardened"

      - name: Package
        run: |
          zip="Eyelid-$VERSION.zip"
          # ditto keeps the symlinks inside MediaRemoteAdapter.framework.
          ditto -c -k --keepParent build/Eyelid.app "build/$zip"
          (cd build && shasum -a 256 "$zip" > "$zip.sha256")
          cat "build/$zip.sha256"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: build/Eyelid-*.zip*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    # Publishing needs no Mac.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: build

      # Lets anyone check that the zip was built by this workflow from this tag:
      # gh attestation verify Eyelid-X.Y.Z.zip --repo Satis-ku/Eyelid
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/Eyelid-${{ needs.build.outputs.version }}.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/Eyelid-$VERSION.zip" "build/Eyelid-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Eyelid $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag \
            ${flags[@]+"${flags[@]}"}
